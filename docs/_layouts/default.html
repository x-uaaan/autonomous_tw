<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#312e81">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇹🇼</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/horizon.css' | relative_url }}">
  <script src="{{ '/assets/js/horizon.js' | relative_url }}" defer></script>
</head>
<body>
  <!-- Language Toggle injected by JS -->
  {% include header.html %}

  <main class="hz-container">
    <div class="hz-hero" id="hz-hero">
      <!-- Hero Card rendered by JS -->
    </div>

    <section class="hz-featured" id="hz-featured">
      <!-- Featured Cards rendered by JS -->
    </section>

    <section class="hz-list" id="hz-list">
      <!-- List View rendered by JS -->
    </section>

    <aside class="hz-sidebar">
      <div class="hz-tag-cloud" id="hz-tag-cloud">
        <!-- Tag Cloud rendered by JS -->
      </div>

      <div class="hz-calendar" id="hz-calendar">
        <!-- Calendar navigation rendered by JS -->
      </div>
    </aside>
  </main>

  {{ content }}

  <footer class="hz-footer">
    <p>🇹🇼 <strong>autonomous.tw</strong> — 資訊自主，真實可溯 · 本地 LLM 優先 · <a href="https://github.com/WolfgangYu/autonomous.tw">GitHub</a></p>
  </footer>
</body>
</html>
